<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>联系我们 - 某信息工程学院</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f0f4f8;color:#333;}
    header{background:#1a5fa8;color:#fff;padding:24px 40px;}
    header h1{margin:0;font-size:28px;}
    nav{background:#154d8a;display:flex;padding:0 40px;}
    nav a{color:#fff;text-decoration:none;padding:12px 20px;font-size:15px;}
    nav a:hover{background:#1a6ec7;}
    .main{max-width:960px;margin:30px auto;padding:0 20px;}
    .card{background:#fff;border-radius:6px;padding:24px;margin-bottom:20px;
          box-shadow:0 2px 6px rgba(0,0,0,.08);}
    .card h2{margin-top:0;color:#1a5fa8;}
    table{width:100%;border-collapse:collapse;}
    td{padding:10px 0;border-bottom:1px solid #eee;vertical-align:top;}
    td:first-child{color:#555;width:120px;font-weight:bold;}
    form label{display:block;margin:12px 0 4px;font-weight:bold;}
    form input, form textarea{width:100%;box-sizing:border-box;padding:8px;
      border:1px solid #ccc;border-radius:4px;font-size:14px;}
    form textarea{height:100px;resize:vertical;}
    form button{margin-top:12px;padding:10px 28px;background:#1a5fa8;
      color:#fff;border:none;border-radius:4px;font-size:15px;cursor:pointer;}
    form button:hover{background:#1a6ec7;}
    footer{background:#1a5fa8;color:#fff;text-align:center;padding:16px;font-size:13px;}
  </style>
</head>
<body>

<header>
  <h1>联系我们</h1>
</header>

<nav>
  <a href="index.html">首页</a>
  <a href="teaching.html">教学平台</a>
  <a href="research.html">科研成果</a>
  <a href="news.html">新闻动态</a>
  <a href="contact.html">联系我们</a>
</nav>

<div class="main">

  <div class="card">
    <h2>联系方式</h2>
    <table>
      <tr><td>地址</td><td>XX市XX区XX路XX号 某信息工程学院</td></tr>
      <tr><td>邮政编码</td><td>XXXXXX</td></tr>
      <tr><td>学院办公室</td><td>+86-XXX-XXXXXXXX</td></tr>
      <tr><td>教务管理</td><td>+86-XXX-XXXXXXXX</td></tr>
      <tr><td>电子邮箱</td><td>office@example.edu.cn</td></tr>
      <tr><td>网站管理员</td><td>webmaster@example.edu.cn</td></tr>
    </table>
  </div>

  <div class="card">
    <h2>在线留言</h2>
    <form>
      <label>姓名</label>
      <input type="text" placeholder="请输入您的姓名">
      <label>联系方式（电话或邮箱）</label>
      <input type="text" placeholder="请输入您的联系方式">
      <label>留言内容</label>
      <textarea placeholder="请输入您的留言内容..."></textarea>
      <button type="submit">提交留言</button>
    </form>
    <p style="color:#888;font-size:13px;margin-top:12px;">
      * 我们将在 3 个工作日内回复您的留言。
    </p>
  </div>

</div>

<footer>
  &copy; 2024 某信息工程学院 版权所有
</footer>

</body>
</html>
